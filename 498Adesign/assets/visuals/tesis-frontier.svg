<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!--
    Tesis · 01 · La frontera decisiva
    Diagrama estructural editorial: 3 zonas (Investigación · 498A · Consultoría madura)
    Equación de valor dentro de 498A: ciencia + IA + ejecución = ventaja
    Markers laterales: papers (izq) · tech normalizada (der)
    Frame-cross corners + grid backdrop + caption mono
    Sin elementos orgánicos · pura tipo planos técnicos
  -->

  <defs>
    <pattern id="tf-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1A1A1A" stroke-width="0.4" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fondo blanco + grid sutil -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  <rect width="600" height="600" fill="url(#tf-grid)"/>

  <!-- ============================================================
       ZONAS · 3 columnas verticales
       ============================================================ -->

  <!-- Zona 01 · INVESTIGACIÓN (izquierda) -->
  <rect x="60" y="100" width="160" height="340" fill="#FAFAFA" stroke="#1A1A1A" stroke-width="0.6"/>
  <text x="140" y="78" font-family="'Roboto Mono', monospace" font-size="8" text-anchor="middle" fill="#5C5C5C" letter-spacing="1.5">ZONA 01</text>
  <text x="140" y="92" font-family="'Roboto Mono', monospace" font-size="10" text-anchor="middle" fill="#1A1A1A" letter-spacing="2" font-weight="500">INVESTIGACIÓN</text>

  <!-- Zona 02 · 498A (centro · highlight verde) -->
  <rect x="220" y="60" width="160" height="380" fill="#E9F9EC" stroke="#0E7A1F" stroke-width="1.2"/>
  <text x="300" y="36" font-family="'Roboto Mono', monospace" font-size="8" text-anchor="middle" fill="#0E7A1F" letter-spacing="1.5" font-weight="600">FRONTERA DECISIVA</text>
  <text x="300" y="54" font-family="'Bebas Neue', Impact, sans-serif" font-size="24" text-anchor="middle" fill="#0E7A1F" letter-spacing="3" font-weight="600">498A</text>

  <!-- Zona 03 · CONSULTORÍA MADURA (derecha) -->
  <rect x="380" y="100" width="160" height="340" fill="#FAFAFA" stroke="#1A1A1A" stroke-width="0.6"/>
  <text x="460" y="78" font-family="'Roboto Mono', monospace" font-size="8" text-anchor="middle" fill="#5C5C5C" letter-spacing="1.5">ZONA 03</text>
  <text x="460" y="92" font-family="'Roboto Mono', monospace" font-size="10" text-anchor="middle" fill="#1A1A1A" letter-spacing="2" font-weight="500">CONSULTORÍA MADURA</text>

  <!-- Conectores entre zonas (líneas hairline) -->
  <line x1="220" y1="250" x2="200" y2="250" stroke="#1A1A1A" stroke-width="0.6"/>
  <line x1="380" y1="250" x2="400" y2="250" stroke="#1A1A1A" stroke-width="0.6"/>

  <!-- ============================================================
       ECUACIÓN INTERIOR DE 498A · ciencia + IA + ejecución = ventaja
       ============================================================ -->

  <text x="300" y="160" font-family="'Hepta Slab', Georgia, serif" font-style="italic" font-size="15" text-anchor="middle" fill="#1A1A1A" font-weight="300">ciencia</text>
  <line x1="240" y1="180" x2="360" y2="180" stroke="#0E7A1F" stroke-width="0.4"/>

  <text x="300" y="218" font-family="'Hepta Slab', Georgia, serif" font-style="italic" font-size="15" text-anchor="middle" fill="#1A1A1A" font-weight="300">+ IA</text>
  <line x1="240" y1="238" x2="360" y2="238" stroke="#0E7A1F" stroke-width="0.4"/>

  <text x="300" y="276" font-family="'Hepta Slab', Georgia, serif" font-style="italic" font-size="15" text-anchor="middle" fill="#1A1A1A" font-weight="300">+ ejecución</text>
  <line x1="240" y1="296" x2="360" y2="296" stroke="#0E7A1F" stroke-width="0.4"/>

  <text x="300" y="345" font-family="'Hepta Slab', Georgia, serif" font-style="italic" font-size="20" text-anchor="middle" fill="#0E7A1F" font-weight="500">= ventaja</text>

  <!-- Mini cuadrado verde marker decorativo bajo "= ventaja" -->
  <rect x="294" y="370" width="12" height="12" fill="#2DD60F"/>

  <!-- ============================================================
       MARKERS LATERALES · papers (izq circles) · tech mature (der squares)
       ============================================================ -->

  <g fill="#1A1A1A">
    <circle cx="95" cy="170" r="3"/>
    <circle cx="145" cy="200" r="3"/>
    <circle cx="185" cy="160" r="3"/>
    <circle cx="115" cy="250" r="3"/>
    <circle cx="170" cy="290" r="3"/>
    <circle cx="90" cy="330" r="3"/>
    <circle cx="155" cy="360" r="3"/>
    <circle cx="195" cy="390" r="3"/>
    <circle cx="105" cy="400" r="3"/>
  </g>

  <g fill="none" stroke="#1A1A1A" stroke-width="0.7">
    <rect x="415" y="160" width="14" height="14"/>
    <rect x="455" y="195" width="14" height="14"/>
    <rect x="500" y="160" width="14" height="14"/>
    <rect x="425" y="240" width="14" height="14"/>
    <rect x="475" y="275" width="14" height="14"/>
    <rect x="510" y="245" width="14" height="14"/>
    <rect x="445" y="330" width="14" height="14"/>
    <rect x="495" y="370" width="14" height="14"/>
    <rect x="420" y="395" width="14" height="14"/>
  </g>

  <!-- Etiquetas leyenda inferior -->
  <text x="140" y="478" font-family="'Roboto Mono', monospace" font-size="8" text-anchor="middle" fill="#5C5C5C" letter-spacing="1.2">● papers no aplicados</text>
  <text x="460" y="478" font-family="'Roboto Mono', monospace" font-size="8" text-anchor="middle" fill="#5C5C5C" letter-spacing="1.2">□ tech ya normalizada</text>

  <!-- ============================================================
       EJE TEMPORAL HORIZONTAL · T₀ → T∞
       ============================================================ -->

  <line x1="60" y1="510" x2="540" y2="510" stroke="#1A1A1A" stroke-width="0.8"/>
  <!-- Ticks -->
  <line x1="60" y1="510" x2="60" y2="516" stroke="#1A1A1A" stroke-width="0.8"/>
  <line x1="140" y1="510" x2="140" y2="514" stroke="#1A1A1A" stroke-width="0.5"/>
  <line x1="300" y1="510" x2="300" y2="516" stroke="#0E7A1F" stroke-width="0.8"/>
  <line x1="460" y1="510" x2="460" y2="514" stroke="#1A1A1A" stroke-width="0.5"/>
  <line x1="540" y1="510" x2="540" y2="516" stroke="#1A1A1A" stroke-width="0.8"/>

  <text x="60" y="530" font-family="'Roboto Mono', monospace" font-size="8" fill="#5C5C5C" letter-spacing="1.2">T₀</text>
  <text x="300" y="530" font-family="'Roboto Mono', monospace" font-size="8" text-anchor="middle" fill="#0E7A1F" letter-spacing="1.2" font-weight="600">NOW</text>
  <text x="540" y="530" font-family="'Roboto Mono', monospace" font-size="8" text-anchor="end" fill="#5C5C5C" letter-spacing="1.2">T∞</text>

  <!-- ============================================================
       FRAME-CROSS CORNERS · 4 esquinas (eco del sistema editorial)
       ============================================================ -->

  <g stroke="#1A1A1A" stroke-width="1" fill="none">
    <!-- TL -->
    <line x1="20" y1="20" x2="40" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="40"/>
    <!-- TR -->
    <line x1="560" y1="20" x2="580" y2="20"/>
    <line x1="580" y1="20" x2="580" y2="40"/>
    <!-- BL -->
    <line x1="20" y1="560" x2="20" y2="580"/>
    <line x1="20" y1="580" x2="40" y2="580"/>
    <!-- BR -->
    <line x1="560" y1="580" x2="580" y2="580"/>
    <line x1="580" y1="560" x2="580" y2="580"/>
  </g>

  <!-- Caption final -->
  <text x="300" y="572" font-family="'Roboto Mono', monospace" font-size="9" text-anchor="middle" fill="#999" letter-spacing="1.5">FIG. 01 · LA FRONTERA DECISIVA · 498A LAB</text>
</svg>
