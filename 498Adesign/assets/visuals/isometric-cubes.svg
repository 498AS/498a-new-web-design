<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!--
    Placeholder · cubos isométricos en cascada
    Mimica el look de Isomorphic Labs "Our Goal" section
    Para sustituir por imagen IA real (Recraft v3 / Midjourney) cuando esté lista
    Paleta: verde menta light + cyan light + verde profundo accents
  -->
  <defs>
    <!-- gradientes por cubo · light/medium/dark face -->
    <linearGradient id="mintLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8F5C6"/>
      <stop offset="100%" stop-color="#86E9A8"/>
    </linearGradient>
    <linearGradient id="mintMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74D898"/>
      <stop offset="100%" stop-color="#48C375"/>
    </linearGradient>
    <linearGradient id="mintDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DB668"/>
      <stop offset="100%" stop-color="#2A9B53"/>
    </linearGradient>
    <linearGradient id="cyanLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8E8F0"/>
      <stop offset="100%" stop-color="#85D2E0"/>
    </linearGradient>
    <linearGradient id="cyanMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74BACA"/>
      <stop offset="100%" stop-color="#4FA4B8"/>
    </linearGradient>
    <linearGradient id="cyanDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B8898"/>
      <stop offset="100%" stop-color="#2A6B7A"/>
    </linearGradient>

    <!-- Reusable cube symbol with L=60 -->
    <symbol id="cube-mint" viewBox="-60 -60 120 120">
      <!-- Top face (lightest) -->
      <polygon points="0,-30 52,-15 0,0 -52,-15" fill="url(#mintLight)"/>
      <!-- Right face (medium) -->
      <polygon points="0,0 52,-15 52,45 0,60" fill="url(#mintMid)"/>
      <!-- Left face (darkest) -->
      <polygon points="0,0 -52,-15 -52,45 0,60" fill="url(#mintDark)"/>
    </symbol>
    <symbol id="cube-cyan" viewBox="-60 -60 120 120">
      <polygon points="0,-30 52,-15 0,0 -52,-15" fill="url(#cyanLight)"/>
      <polygon points="0,0 52,-15 52,45 0,60" fill="url(#cyanMid)"/>
      <polygon points="0,0 -52,-15 -52,45 0,60" fill="url(#cyanDark)"/>
    </symbol>
  </defs>

  <!-- Cluster superior · grupo apretado de cubos verde menta -->
  <use href="#cube-mint" x="440" y="100" width="120" height="120"/>
  <use href="#cube-mint" x="500" y="130" width="120" height="120"/>
  <use href="#cube-mint" x="440" y="160" width="120" height="120"/>
  <use href="#cube-mint" x="380" y="130" width="120" height="120"/>
  <use href="#cube-mint" x="500" y="190" width="120" height="120"/>
  <use href="#cube-mint" x="440" y="220" width="120" height="120"/>

  <!-- Cubo flotante aislado · accent -->
  <use href="#cube-mint" x="270" y="200" width="80" height="80"/>

  <!-- Transición media · mezcla verde y cyan -->
  <use href="#cube-mint" x="480" y="290" width="100" height="100"/>
  <use href="#cube-cyan" x="540" y="320" width="100" height="100"/>
  <use href="#cube-cyan" x="480" y="350" width="100" height="100"/>

  <!-- Cluster inferior · cyan light -->
  <use href="#cube-cyan" x="420" y="420" width="100" height="100"/>
  <use href="#cube-cyan" x="480" y="450" width="100" height="100"/>
  <use href="#cube-cyan" x="540" y="480" width="100" height="100"/>
  <use href="#cube-cyan" x="380" y="450" width="100" height="100"/>
  <use href="#cube-cyan" x="440" y="490" width="100" height="100"/>
</svg>
