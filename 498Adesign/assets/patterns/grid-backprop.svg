<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!--
    Trama backpropagation · v2
    Solo PUNTOS grises en intersecciones (sin líneas de cuadrícula)
    Números MUY pequeños · diagonal verde = gradient activo
    Tile 120×120 · puntos en grid imaginario 20×20
  -->

  <!-- Fondo blanco -->
  <rect width="120" height="120" fill="#FFFFFF"/>

  <!-- Cells con fill verde sutil en la diagonal · marca el flujo activo -->
  <rect x="100" y="20"  width="20" height="20" fill="#2DD60F" fill-opacity="0.05"/>
  <rect x="80"  y="40"  width="20" height="20" fill="#2DD60F" fill-opacity="0.07"/>
  <rect x="60"  y="60"  width="20" height="20" fill="#2DD60F" fill-opacity="0.09"/>
  <rect x="40"  y="80"  width="20" height="20" fill="#2DD60F" fill-opacity="0.07"/>
  <rect x="20"  y="100" width="20" height="20" fill="#2DD60F" fill-opacity="0.05"/>

  <!-- PUNTOS grises en intersecciones del grid imaginario · 6×6 -->
  <g fill="#999999" fill-opacity="0.45">
    <circle cx="0"   cy="0"   r="0.9"/>
    <circle cx="20"  cy="0"   r="0.9"/>
    <circle cx="40"  cy="0"   r="0.9"/>
    <circle cx="60"  cy="0"   r="0.9"/>
    <circle cx="80"  cy="0"   r="0.9"/>
    <circle cx="100" cy="0"   r="0.9"/>

    <circle cx="0"   cy="20"  r="0.9"/>
    <circle cx="20"  cy="20"  r="0.9"/>
    <circle cx="40"  cy="20"  r="0.9"/>
    <circle cx="60"  cy="20"  r="0.9"/>
    <circle cx="80"  cy="20"  r="0.9"/>
    <circle cx="100" cy="20"  r="0.9"/>

    <circle cx="0"   cy="40"  r="0.9"/>
    <circle cx="20"  cy="40"  r="0.9"/>
    <circle cx="40"  cy="40"  r="0.9"/>
    <circle cx="60"  cy="40"  r="0.9"/>
    <circle cx="80"  cy="40"  r="0.9"/>
    <circle cx="100" cy="40"  r="0.9"/>

    <circle cx="0"   cy="60"  r="0.9"/>
    <circle cx="20"  cy="60"  r="0.9"/>
    <circle cx="40"  cy="60"  r="0.9"/>
    <circle cx="60"  cy="60"  r="0.9"/>
    <circle cx="80"  cy="60"  r="0.9"/>
    <circle cx="100" cy="60"  r="0.9"/>

    <circle cx="0"   cy="80"  r="0.9"/>
    <circle cx="20"  cy="80"  r="0.9"/>
    <circle cx="40"  cy="80"  r="0.9"/>
    <circle cx="60"  cy="80"  r="0.9"/>
    <circle cx="80"  cy="80"  r="0.9"/>
    <circle cx="100" cy="80"  r="0.9"/>

    <circle cx="0"   cy="100" r="0.9"/>
    <circle cx="20"  cy="100" r="0.9"/>
    <circle cx="40"  cy="100" r="0.9"/>
    <circle cx="60"  cy="100" r="0.9"/>
    <circle cx="80"  cy="100" r="0.9"/>
    <circle cx="100" cy="100" r="0.9"/>
  </g>

  <!-- Números MUY pequeños · 5 px mono -->
  <g font-family="'Roboto Mono', ui-monospace, monospace" font-size="5" text-anchor="middle">

    <!-- Diagonal · gradientes ACTIVOS (verde profundo + verde primario) -->
    <text x="110" y="30"  fill="#0E7A1F" font-weight="500" dominant-baseline="central">0.34</text>
    <text x="90"  y="50"  fill="#0E7A1F" font-weight="500" dominant-baseline="central">-0.12</text>
    <text x="70"  y="70"  fill="#2DD60F" font-weight="600" dominant-baseline="central">1.05</text>
    <text x="50"  y="90"  fill="#0E7A1F" font-weight="500" dominant-baseline="central">-0.45</text>
    <text x="30"  y="110" fill="#0E7A1F" font-weight="500" dominant-baseline="central">0.92</text>

    <!-- Background · gradientes DORMIDOS (gris claro) -->
    <text x="50"  y="30"  fill="#BFBFBF" dominant-baseline="central">0.78</text>
    <text x="30"  y="50"  fill="#BFBFBF" dominant-baseline="central">-0.83</text>
    <text x="110" y="90"  fill="#BFBFBF" dominant-baseline="central">1.21</text>
    <text x="70"  y="110" fill="#BFBFBF" dominant-baseline="central">-0.66</text>
  </g>
</svg>
