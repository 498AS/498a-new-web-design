<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!--
    Cuadrícula científica · 4×4 cells de 20×20
    Algunos cells rellenos sutilmente (brand greens) → lectura data-viz
    Líneas hairline en grid · puntos en intersecciones
  -->

  <!-- Cells rellenos sutiles · simulan datos en celdas -->
  <rect x="0"  y="0"  width="20" height="20" fill="#0E7A1F" fill-opacity="0.05"/>
  <rect x="40" y="20" width="20" height="20" fill="#2DD60F" fill-opacity="0.06"/>
  <rect x="20" y="40" width="20" height="20" fill="#0E7A1F" fill-opacity="0.04"/>
  <rect x="60" y="60" width="20" height="20" fill="#2DD60F" fill-opacity="0.06"/>

  <!-- Líneas de cuadrícula sobre las cells -->
  <g stroke="#000000" stroke-opacity="0.07" stroke-width="0.5">
    <line x1="20" y1="0" x2="20" y2="80"/>
    <line x1="40" y1="0" x2="40" y2="80"/>
    <line x1="60" y1="0" x2="60" y2="80"/>
    <line x1="0" y1="20" x2="80" y2="20"/>
    <line x1="0" y1="40" x2="80" y2="40"/>
    <line x1="0" y1="60" x2="80" y2="60"/>
  </g>

  <!-- Puntos en algunas intersecciones · acentos verdes -->
  <circle cx="20" cy="20" r="1" fill="#0E7A1F" fill-opacity="0.45"/>
  <circle cx="60" cy="40" r="1" fill="#2DD60F" fill-opacity="0.45"/>
  <circle cx="40" cy="60" r="1" fill="#0E7A1F" fill-opacity="0.45"/>
  <circle cx="20" cy="80" r="1" fill="#2DD60F" fill-opacity="0.4"/>
</svg>
