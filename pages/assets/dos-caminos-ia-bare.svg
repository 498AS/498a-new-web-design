<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 940 922" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los dos caminos de la IA: trabajar con ella y construir con ella, estilo 498A"><text x="470.0" y="54" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#0E7A1F" letter-spacing="0.6px">CUANDO YA SABES TRABAJAR CON IA</text><line x1="430" y1="74" x2="501" y2="74" stroke="#2DD60F" stroke-width="2" stroke-linecap="square"/><path d="M501,69 L510,74 L501,79 Z" fill="#2DD60F"/><rect x="40" y="100" width="380" height="470" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><path d="M33,100 L47,100 M40,93 L40,107" stroke="#1A1A1A" stroke-width="1"/><path d="M413,100 L427,100 M420,93 L420,107" stroke="#1A1A1A" stroke-width="1"/><path d="M33,570 L47,570 M40,563 L40,577" stroke="#1A1A1A" stroke-width="1"/><path d="M413,570 L427,570 M420,563 L420,577" stroke="#1A1A1A" stroke-width="1"/><text x="64" y="132" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#0E7A1F" letter-spacing="1px">01</text><text x="396" y="132" text-anchor="end" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#5C5C5C" letter-spacing="1.2px">BARRERA BAJA</text><line x1="64" y1="144" x2="396" y2="144" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="180" text-anchor="start" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="26" font-weight="400" fill="#1A1A1A" letter-spacing="0.5px">Trabajar con la IA</text><text x="64" y="210" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#5C5C5C">Delegas en las herramientas que ya pagas: la</text><text x="64" y="228" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#5C5C5C">IA hace lo mismo que tú, más rápido y a más volumen.</text><rect x="64" y="264" width="7" height="7" fill="#0E7A1F"/><text x="80" y="272" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Redactar y responder correos con criterio</text><rect x="64" y="291" width="7" height="7" fill="#0E7A1F"/><text x="80" y="299" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Preparar propuestas desde tu Drive</text><rect x="64" y="318" width="7" height="7" fill="#0E7A1F"/><text x="80" y="326" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Resumir reuniones y delegar la administración</text><rect x="64" y="345" width="7" height="7" fill="#0E7A1F"/><text x="80" y="353" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Investigar antes de una decisión</text><line x1="64" y1="500" x2="396" y2="500" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="524" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#1A1A1A" letter-spacing="0.6px">CLAUDE · CHATGPT · COPILOT · GEMINI</text><text x="64" y="550" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="10.5" font-weight="300" fill="#5C5C5C">Chat, Cowork y conectores. Empiezas aquí.</text><rect x="520" y="100" width="380" height="470" fill="#000000" stroke="#0E7A1F" stroke-width="1"/><path d="M513,100 L527,100 M520,93 L520,107" stroke="#2DD60F" stroke-width="1"/><path d="M893,100 L907,100 M900,93 L900,107" stroke="#2DD60F" stroke-width="1"/><path d="M513,570 L527,570 M520,563 L520,577" stroke="#2DD60F" stroke-width="1"/><path d="M893,570 L907,570 M900,563 L900,577" stroke="#2DD60F" stroke-width="1"/><text x="544" y="132" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#2DD60F" letter-spacing="1px">02</text><text x="876" y="132" text-anchor="end" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#BFBFBF" letter-spacing="1.2px">BARRERA ALTA</text><line x1="544" y1="144" x2="876" y2="144" stroke="#0E7A1F" stroke-width="1"/><text x="544" y="180" text-anchor="start" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" letter-spacing="0.5px">Construir con la IA</text><text x="544" y="210" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#BFBFBF">Creas una herramienta, un dashboard o un agente</text><text x="544" y="228" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#BFBFBF">que usan otras personas. Más técnico, más alcance.</text><rect x="544" y="264" width="7" height="7" fill="#2DD60F"/><text x="560" y="272" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Generadores de imagen y vídeo a escala</text><rect x="544" y="291" width="7" height="7" fill="#2DD60F"/><text x="560" y="299" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Automatizaciones robustas sobre tus datos</text><rect x="544" y="318" width="7" height="7" fill="#2DD60F"/><text x="560" y="326" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Agentes que ejecutan procesos punta a punta</text><rect x="544" y="345" width="7" height="7" fill="#2DD60F"/><text x="560" y="353" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Dashboards y prototipos sin código a mano</text><line x1="544" y1="500" x2="876" y2="500" stroke="#0E7A1F" stroke-width="1"/><text x="544" y="524" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#FFFFFF" letter-spacing="0.6px">CLAUDE CODE · CODEX · LOVABLE · ELEVENLABS</text><text x="544" y="550" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="10.5" font-weight="300" fill="#BFBFBF">Entras en las APIs. Llegas aquí, no empiezas aquí.</text><rect x="40" y="598" width="860" height="78" fill="#E9F9EC" stroke="#0E7A1F" stroke-width="1"/><path d="M33,598 L47,598 M40,591 L40,605" stroke="#0E7A1F" stroke-width="1"/><path d="M893,598 L907,598 M900,591 L900,605" stroke="#0E7A1F" stroke-width="1"/><path d="M33,676 L47,676 M40,669 L40,683" stroke="#0E7A1F" stroke-width="1"/><path d="M893,676 L907,676 M900,669 L900,683" stroke="#0E7A1F" stroke-width="1"/><rect x="64" y="624" width="10" height="10" fill="#0E7A1F"/><text x="84" y="633" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="500" fill="#0E7A1F" letter-spacing="1px">EL CRUCE</text><text x="84" y="655" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#1A1A1A">La misma suscripción paga las dos columnas. Lovable, Claude Code y los agentes de research ya viven en ambas a la vez.</text><rect x="40" y="716" width="860" height="176" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="756" text-anchor="start" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="21" font-weight="400" fill="#1A1A1A" letter-spacing="0.3px">NO ES UNA CAJA DE CHAT. ES UN TALLER.</text><text x="64" y="780" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#5C5C5C">El error de la primera semana es creer que la IA es la ventana de chat. Es un taller entero, y lo recoges pieza a pieza:</text><rect x="64.0" y="798" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="78.0" y="814" width="7" height="7" fill="#2DD60F"/><text x="94.0" y="820" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">COWORK</text><text x="78.0" y="842" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Delegar tareas enteras,</text><text x="78.0" y="858" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">no frases sueltas</text><rect x="271.0" y="798" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="285.0" y="814" width="7" height="7" fill="#2DD60F"/><text x="301.0" y="820" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">CONECTORES</text><text x="285.0" y="842" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Enchufarla a tu Drive,</text><text x="285.0" y="858" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">correo y calendario</text><rect x="478.0" y="798" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="492.0" y="814" width="7" height="7" fill="#2DD60F"/><text x="508.0" y="820" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">SKILLS</text><text x="492.0" y="842" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Enseñarle tus procesos</text><text x="492.0" y="858" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">para no repetir contexto</text><rect x="685.0" y="798" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="699.0" y="814" width="7" height="7" fill="#2DD60F"/><text x="715.0" y="820" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">CODE</text><text x="699.0" y="842" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Construir tus propias</text><text x="699.0" y="858" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">herramientas, sin IT</text></svg>