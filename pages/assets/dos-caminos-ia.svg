<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 940 1026" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los dos caminos de la IA: trabajar con ella y construir con ella, estilo 498A"><text x="40" y="30" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="500" fill="#0E7A1F" letter-spacing="1.6px">MARCO 498A · DOS VELOCIDADES DE ADOPCIÓN</text><text x="40" y="70" text-anchor="start" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="33" font-weight="400" fill="#1A1A1A" letter-spacing="0.3px">SOLO HAY DOS CAMINOS EN LA IA</text><text x="40" y="100" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="13" font-weight="300" fill="#5C5C5C">No eliges hoy. Primero trabajas con ella; construir viene después, y no hace falta ser programador.</text><text x="470.0" y="158" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#0E7A1F" letter-spacing="0.6px">CUANDO YA SABES TRABAJAR CON IA</text><line x1="430" y1="178" x2="501" y2="178" stroke="#2DD60F" stroke-width="2" stroke-linecap="square"/><path d="M501,173 L510,178 L501,183 Z" fill="#2DD60F"/><rect x="40" y="204" width="380" height="470" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><path d="M33,204 L47,204 M40,197 L40,211" stroke="#1A1A1A" stroke-width="1"/><path d="M413,204 L427,204 M420,197 L420,211" stroke="#1A1A1A" stroke-width="1"/><path d="M33,674 L47,674 M40,667 L40,681" stroke="#1A1A1A" stroke-width="1"/><path d="M413,674 L427,674 M420,667 L420,681" stroke="#1A1A1A" stroke-width="1"/><text x="64" y="236" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#0E7A1F" letter-spacing="1px">01</text><text x="396" y="236" text-anchor="end" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#5C5C5C" letter-spacing="1.2px">BARRERA BAJA</text><line x1="64" y1="248" x2="396" y2="248" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="284" text-anchor="start" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="26" font-weight="400" fill="#1A1A1A" letter-spacing="0.5px">Trabajar con la IA</text><text x="64" y="314" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#5C5C5C">Delegas en las herramientas que ya pagas: la</text><text x="64" y="332" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#5C5C5C">IA hace lo mismo que tú, más rápido y a más volumen.</text><rect x="64" y="368" width="7" height="7" fill="#0E7A1F"/><text x="80" y="376" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Redactar y responder correos con criterio</text><rect x="64" y="395" width="7" height="7" fill="#0E7A1F"/><text x="80" y="403" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Preparar propuestas desde tu Drive</text><rect x="64" y="422" width="7" height="7" fill="#0E7A1F"/><text x="80" y="430" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Resumir reuniones y delegar la administración</text><rect x="64" y="449" width="7" height="7" fill="#0E7A1F"/><text x="80" y="457" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#1A1A1A">Investigar antes de una decisión</text><line x1="64" y1="604" x2="396" y2="604" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="628" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#1A1A1A" letter-spacing="0.6px">CLAUDE · CHATGPT · COPILOT · GEMINI</text><text x="64" y="654" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="10.5" font-weight="300" fill="#5C5C5C">Chat, Cowork y conectores. Empiezas aquí.</text><rect x="520" y="204" width="380" height="470" fill="#000000" stroke="#0E7A1F" stroke-width="1"/><path d="M513,204 L527,204 M520,197 L520,211" stroke="#2DD60F" stroke-width="1"/><path d="M893,204 L907,204 M900,197 L900,211" stroke="#2DD60F" stroke-width="1"/><path d="M513,674 L527,674 M520,667 L520,681" stroke="#2DD60F" stroke-width="1"/><path d="M893,674 L907,674 M900,667 L900,681" stroke="#2DD60F" stroke-width="1"/><text x="544" y="236" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#2DD60F" letter-spacing="1px">02</text><text x="876" y="236" text-anchor="end" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#BFBFBF" letter-spacing="1.2px">BARRERA ALTA</text><line x1="544" y1="248" x2="876" y2="248" stroke="#0E7A1F" stroke-width="1"/><text x="544" y="284" text-anchor="start" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" letter-spacing="0.5px">Construir con la IA</text><text x="544" y="314" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#BFBFBF">Creas una herramienta, un dashboard o un agente</text><text x="544" y="332" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#BFBFBF">que usan otras personas. Más técnico, más alcance.</text><rect x="544" y="368" width="7" height="7" fill="#2DD60F"/><text x="560" y="376" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Generadores de imagen y vídeo a escala</text><rect x="544" y="395" width="7" height="7" fill="#2DD60F"/><text x="560" y="403" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Automatizaciones robustas sobre tus datos</text><rect x="544" y="422" width="7" height="7" fill="#2DD60F"/><text x="560" y="430" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Agentes que ejecutan procesos punta a punta</text><rect x="544" y="449" width="7" height="7" fill="#2DD60F"/><text x="560" y="457" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12" font-weight="300" fill="#FFFFFF">Dashboards y prototipos sin código a mano</text><line x1="544" y1="604" x2="876" y2="604" stroke="#0E7A1F" stroke-width="1"/><text x="544" y="628" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="500" fill="#FFFFFF" letter-spacing="0.6px">CLAUDE CODE · CODEX · LOVABLE · ELEVENLABS</text><text x="544" y="654" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="10.5" font-weight="300" fill="#BFBFBF">Entras en las APIs. Llegas aquí, no empiezas aquí.</text><rect x="40" y="702" width="860" height="78" fill="#E9F9EC" stroke="#0E7A1F" stroke-width="1"/><path d="M33,702 L47,702 M40,695 L40,709" stroke="#0E7A1F" stroke-width="1"/><path d="M893,702 L907,702 M900,695 L900,709" stroke="#0E7A1F" stroke-width="1"/><path d="M33,780 L47,780 M40,773 L40,787" stroke="#0E7A1F" stroke-width="1"/><path d="M893,780 L907,780 M900,773 L900,787" stroke="#0E7A1F" stroke-width="1"/><rect x="64" y="728" width="10" height="10" fill="#0E7A1F"/><text x="84" y="737" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="500" fill="#0E7A1F" letter-spacing="1px">EL CRUCE</text><text x="84" y="759" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#1A1A1A">La misma suscripción paga las dos columnas. Lovable, Claude Code y los agentes de research ya viven en ambas a la vez.</text><rect x="40" y="820" width="860" height="176" fill="#F7F7F7" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="860" text-anchor="start" font-family="'Bebas Neue', Impact, 'Arial Narrow', sans-serif" font-size="21" font-weight="400" fill="#1A1A1A" letter-spacing="0.3px">NO ES UNA CAJA DE CHAT. ES UN TALLER.</text><text x="64" y="884" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="12.5" font-weight="300" fill="#5C5C5C">El error de la primera semana es creer que la IA es la ventana de chat. Es un taller entero, y lo recoges pieza a pieza:</text><rect x="64.0" y="902" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="78.0" y="918" width="7" height="7" fill="#2DD60F"/><text x="94.0" y="924" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">COWORK</text><text x="78.0" y="946" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Delegar tareas enteras,</text><text x="78.0" y="962" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">no frases sueltas</text><rect x="271.0" y="902" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="285.0" y="918" width="7" height="7" fill="#2DD60F"/><text x="301.0" y="924" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">CONECTORES</text><text x="285.0" y="946" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Enchufarla a tu Drive,</text><text x="285.0" y="962" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">correo y calendario</text><rect x="478.0" y="902" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="492.0" y="918" width="7" height="7" fill="#2DD60F"/><text x="508.0" y="924" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">SKILLS</text><text x="492.0" y="946" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Enseñarle tus procesos</text><text x="492.0" y="962" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">para no repetir contexto</text><rect x="685.0" y="902" width="191.0" height="76" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><rect x="699.0" y="918" width="7" height="7" fill="#2DD60F"/><text x="715.0" y="924" text-anchor="start" font-family="'Roboto Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#0E7A1F" letter-spacing="0.8px">CODE</text><text x="699.0" y="946" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">Construir tus propias</text><text x="699.0" y="962" text-anchor="start" font-family="'Hepta Slab', Georgia, serif" font-size="11" font-weight="300" fill="#5C5C5C">herramientas, sin IT</text></svg>